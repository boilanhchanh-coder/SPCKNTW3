<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap');
*{
box-sizing: border-box;
font-family: "Poppins",sans-serif;
}
body{
    background-color:#0a0a09;
    color:#d6cdcd; 
    height: 100%;
    margin: 0;
    padding: 0;
}
.topbar{
    width:100%;
    height:80px;
    background:#111;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 70px;
}
.logo{
    display: flex;
    margin-left: 50px;
    font-family: 'Oswald', sans-serif;
    font-size: 30px;
    font-weight: bold;
    color: white;
}
.right{
    display:flex;
    align-items:center;
    gap:15px;
}
.myinf{
    width:120px;
    height:42px;
    background:#e0743a;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:600;
}
.myinf:hover{
    background:#ff8b4b;
}
.myinfor{
    width:120px;
    height:42px;
    background:#e0743a;
    color:white;
    border-radius:10px;
    font-weight:600;
    border: none;
}
.dong-ke{
    width: 100%;
    height: 0.3px;
    border: none;
    background: #2b2a2a;
    margin: 10px auto;
}
    </style>
</head>
<body onload="hienThiHoSo()">
    <header class="topbar">
        <div class="logo">CINEMA</div>
        <div class="right">
            <button class="myinf">Hồ sơ</button>
            <button class="myinfor" onclick="logout()">Đăng xuất</button>        
        </div>  
    </header><hr class="dong-ke">
    <div class="profile">
        <h2>THÔNG TIN TÀI KHOẢN</h2>
        <p>
            Tên tài khoản:
            <span id="tenTaiKhoan"></span>
        </p>
        <h2>LỊCH SỬ ĐẶT VÉ</h2>
        <table>
            <thead>
                <tr>
                    <th>Tên phim</th>
                    <th>Ngày chiếu</th>
                    <th>Giờ chiếu</th>
                    <th>Suất chiếu</th>
                    <th>Ghế</th>
                    <th>Tổng tiền</th>
                </tr>
            </thead>
            <tbody id="bangVe">
            </tbody>
        </table>
    </div>
<script src="data.js"></script>
<script src="hoso.js"></script>
</body>
</html>
