<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap');
        *{
        box-sizing: border-box;
        font-family: "Poppins",sans-serif;
        }
        body{
            background-color:#0a0a09;
            color:#d6cdcd; 
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .topbar{
            width:100%;
            height:80px;
            background:#111;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 70px;
        }
        .logo{
            display: flex;
            margin-left: 50px;
            font-family: 'Oswald', sans-serif;
            font-size: 30px;
            font-weight: bold;
            color: white;
        }
        .right{
            display:flex;
            align-items:center;
            gap:15px;
        }
        .myinf{
            width:120px;
            height:42px;
            background:#e0743a;
            color:white;
            border:none;
            border-radius:10px;
            font-weight:600;
        }
        .myinf:hover{
            background:#ff8b4b;
        }
        .myinfor{
            width:120px;
            height:42px;
            background:#e0743a;
            color:white;
            border-radius:10px;
            font-weight:600;
            border: none;
        }
        .dong-ke{
            width: 100%;
            height: 0.3px;
            border: none;
            background: #2b2a2a;
            margin: 10px auto;
        }
        body{
            background:#0a0a09;
            color:white;
            font-family:Poppins,sans-serif;
        }

        .profile{
            width:90%;
            max-width:1250px;
            margin:45px auto;
        }

        h1{
            text-align:center;
            color:#e0743a;
            margin-bottom:45px;
            font-size:38px;
        }

        .box{
            border-radius:14px;
            padding:28px;
            margin-bottom:30px;
            box-shadow:0 8px 20px rgba(0,0,0,.35);
        }

        .box h2{
            margin:0 0 22px;
            color:#e0743a;
            font-size:28px;
        }

        .account{
            width:260px;
            margin:0 auto 40px;
            text-align:center;
        }

        .avatar{
            width:100px;
            height:100px;
            margin:auto;
            border-radius:50%;
            background:#e0743a;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:45px;
        }

        .username{
            margin-top:18px;
            font-size:28px;
            font-weight:600;
            color:white;
        }

        .user-info{
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .label{
            color:#999;
            font-size:15px;
        }


        table{
            background:#171717;
            width:100%;
            border-collapse:collapse;
            overflow:hidden;
            border-radius:10px;
        }

        th{
            padding:18px;
            color:white;
            font-size:17px;
        }

        td{
            padding:18px;
            text-align:center;
            border-bottom:1px solid #2b2b2b;
        }

        tbody tr{
            transition:.3s;
        }   

        tbody tr:hover{
            background:#242424;
        }
    </style>
</head>
<body onload="hienThiHoSo()">
    <header class="topbar">
        <div class="logo">CINEMA</div>
        <div class="right">
            <button class="myinf">Hồ sơ</button>
            <button class="myinfor" onclick="logout()">Đăng xuất</button>        
        </div>  
    </header><hr class="dong-ke">
    <div class="profile">
            <div class="account">
                <div class="avatar">👤</div>
                <div class="username" id="tenTaiKhoan"></div>
            </div>

        <div class="box">
            <h2>Lịch sử đặt vé</h2>
            <table>
                <thead>
                    <tr>
                        <th>Tên phim</th>
                        <th>Ngày chiếu</th>
                        <th>Giờ chiếu</th>
                        <th>Suất chiếu</th>
                        <th>Ghế</th>
                        <th>Tổng tiền</th>
                    </tr>
                </thead>
                <tbody id="bangVe"></tbody>
            </table>
        </div>
    </div>
<script src="data.js"></script>
<script src="hoso.js"></script>
</body>
</html>
