<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
   <div class="head">
        <div class="logo">
            <span class="cine">CINE</span><span class="hub">MA</span>
        </div>
        <div class="ttin">HỆ THỐNG QUẢN LÝ & ĐẶT VÉ<br>ĐĂNG NHẬP / ĐĂNG KÝ TÀI KHOẢN</div>
  </div>

  <hr class="dong-ke">

  <div class="frames">
    <div class="login">
        <div class="icon-box">
            <i class="fa-regular fa-user"></i>
        </div>
        <h2>Đăng nhập</h2>
        <label>Tài khoản</label>
        <input type="text" id="loginUser" placeholder="Nhập tên đăng nhập">
        <label>Mật khẩu</label>
        <input type="password" id="loginPass" placeholder="Nhập mật khẩu">
        <p id="loginError" class="login-error"></p>
        <button onclick="login()" class="button-login">
            ĐĂNG NHẬP →
        </button>
    </div>
    <div class="register">
        <div class="icon-box">
        <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2>Đăng ký</h2>
        <label>Tài khoản</label>
        <input type="text" id="regUser" placeholder="Nhập tên đăng ký">
        <div class="mk">
            <div class="cot">
                <label>Mật khẩu</label>
                <input type="password" id="regPass" placeholder="Tối thiểu 8 ký tự">
            </div>
            <div class="cot">
                <label> Xác nhận </label>
                <input type="password" id="xac-nhan" placeholder="Nhập lại mật khẩu">
            </div>
        </div>      
        <p id="registerSuccess" class="register-success"></p>
        <p id="thongBaoDangKy" class="thong-bao-dang-ky"></p>
        <button onclick="register()" class="button-register">
        TẠO TÀI KHOẢN →
        </button>
    </div>
</body>
<script src="data.js"></script>
</html>
