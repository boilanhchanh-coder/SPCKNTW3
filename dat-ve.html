<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt vé</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="dat-ve.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <span class="cine">CINE</span><span class="ma">MA</span>
        </div>
        <div class="right">
            <button class="myinf" onclick="moHoSo()">Hồ sơ</button>
            <button class="myinfor" onclick="logout()">Đăng xuất</button>        
        </div>  
    </header><hr class="dong-ke">
    <section class="container">
        <button class="btn-quay-lai" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i> Quay lại
        </button>
        <div class="khu-chon">
            <h3>Chọn ngày</h3>
            <div class="danh-sach-ngay" id="danh-sach-ngay"></div>
            <h3>Chọn giờ</h3>
            <div class="danh-sach-gio" id="danh-sach-gio"></div>
        </div>
        <div class="khu-ghe" id="khu-ghe">
            <h3>Chọn ghế</h3>
            <div class="man-hinh">MÀN HÌNH</div>
            <div class="sodoghe" id="so-do-ghe"></div>
            <div class="chu-thich">
                <span><i class="hop ghe-mau"></i> Ghế trống</span>
                <span><i class="hop ghe-chon-mau"></i> Đang chọn</span>
                <span><i class="hop ghe-dat-mau"></i> Đã đặt</span>
            </div>

            <div class="tom-tat">
                <div>
                    <p>Ghế đã chọn: <span id="ds-ghe-chon">Chưa chọn</span></p>
                    <p>Tổng tiền: <span id="tong-tien">0 đ</span></p>
                </div>
                <button class="btn-xac-nhan" onclick="moPopupVe()">Xác nhận đặt vé</button>
            </div>
        </div>
    </section>
    <div id="popupVe" class="popup">

    <div class="popup-content">

        <h2>Xác nhận thông tin vé</h2>

        <div class="thong-tin-ve">

            <p><strong>Tên phim:</strong> <span id="popupTenPhim"></span></p>

            <p><strong>Ngày chiếu:</strong> <span id="popupNgay"></span></p>

            <p><strong>Giờ chiếu:</strong> <span id="popupGio"></span></p>

            <p><strong>Suất chiếu:</strong> <span id="popupSuat"></span></p>

            <p><strong>Ghế:</strong> <span id="popupGhe"></span></p>

            <p><strong>Tổng tiền:</strong> <span id="popupTien"></span></p>

        </div>

        <div class="popup-button">

            <button class="btn-huy" onclick="dongPopup()">
                Hủy
            </button>

            <button class="btn-mua" onclick="xacNhanMuaVe()">
                Xác nhận mua vé
            </button>

        </div>
    </div>

</div>
    <script src="data.js"></script>
    <script src="dat-ve.js"></script>
    
</body>
</html>
