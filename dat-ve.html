<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="dat-ve.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">CINEMA</div>
        <div class="right">
            <button class="myinfor" onclick="logout()">Đăng xuất</button>        
        </div>  
    </header><hr class="dong-ke">
    <section class="container">
        <button class="btn-quay-lai" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i> Quay lại
        </button>
        <div class="khu-chon">
            <h3>Chọn ngày</h3>
            <div class="danh-sach-ngay" id="danh-sach-ngay"></div>

            <h3>Chọn giờ</h3>
            <div class="danh-sach-gio" id="danh-sach-gio"></div>
        </div>
        <div class="khu-ghe" id="khu-ghe">
            <h3>Chọn ghế</h3>
            <div class="man-hinh">MÀN HÌNH</div>
            <div class="sodoghe" id="so-do-ghe"></div>

            <div class="chu-thich">
                <span><i class="hop ghe-mau"></i> Ghế trống</span>
                <span><i class="hop ghe-chon-mau"></i> Đang chọn</span>
                <span><i class="hop ghe-dat-mau"></i> Đã đặt</span>
            </div>

            <div class="tom-tat">
                <div>
                    <p>Ghế đã chọn: <span id="ds-ghe-chon">Chưa chọn</span></p>
                    <p>Tổng tiền: <span id="tong-tien">0 đ</span></p>
                </div>
                <button class="btn-xac-nhan" onclick="datVe()">Xác nhận đặt vé</button>
            </div>
        </div>
    </section>
    <script src="data.js"></script>
    <script src="dat-ve.js"></script>
</body>
</html>
